name: Letterboxd (últimas vistas)

on:
  schedule:
    - cron: "11 * * * *"     # cada hora, al minuto 11
  workflow_dispatch:          # botón "Run workflow" para lanzarlo a mano

permissions:
  contents: write

concurrency:
  group: letterboxd
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Descargar RSS de Letterboxd
        run: python3 .github/scripts/letterboxd.py

      - name: Guardar cambios
        run: |
          if git diff --quiet -- letterboxd.json && [ -f letterboxd.json ]; then
            echo "Nada nuevo en Letterboxd"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add letterboxd.json
          git commit -m "Letterboxd: últimas vistas"
          git pull --rebase -q origin main
          git push
