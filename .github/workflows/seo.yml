name: Top 10, sitemap y SEO

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "reviews/**"
      - ".github/scripts/notas.json"
      - ".github/scripts/top.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: seo
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Regenerar top, sitemap, feed y notas
        run: python3 .github/scripts/seo.py

      - name: Guardar cambios
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Nada que actualizar"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Top 10, sitemap y SEO: actualización automática"
          git push
