name: Serializd (últimas vistas)

on:
  schedule:
    - cron: "23 * * * *"     # cada hora, al minuto 23
  workflow_dispatch:          # botón "Run workflow" para lanzarlo a mano

permissions:
  contents: write

concurrency:
  group: serializd
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Descargar diario de Serializd
        run: python3 .github/scripts/serializd.py

      - name: Guardar cambios
        run: |
          if git diff --quiet -- serializd.json; then
            echo "Nada nuevo en Serializd"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add serializd.json
          git commit -m "Serializd: últimas vistas"
          git push
