<!DOCTYPE html>

<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Las Contraluces — Archivo de reseñas</title>
<meta name="description" content="Cine, series y libros a contraluz. Reseñas sin spoilers de Remy Lebeau.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=IBM+Plex+Mono:wght@400;500&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#17140F;
    --glow:#F0A64E;
    --glow-soft:#F6CE93;
    --paper:#FBF5E9;
    --dusk:#3E4658;
    --muted:#8C7A63;
    --card:#1F1B15;
    --line:rgba(23,20,15,0.12);
    --radius:2px;
  }

  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Source Serif 4', serif;
    -webkit-font-smoothing:antialiased;
  }

  /* ---------- HERO ---------- */
  .hero{
    position:relative;
    background:
      radial-gradient(120% 90% at 50% 100%, var(--glow) 0%, #b5622a 32%, #4a3a3f 58%, var(--ink) 78%);
    color:var(--paper);
    overflow:hidden;
    padding:5.5rem 1.5rem 0;
  }
  .hero-inner{
    max-width:920px;
    margin:0 auto;
    text-align:center;
    position:relative;
    z-index:2;
  }
  .eyebrow{
    font-family:'IBM Plex Mono', monospace;
    font-size:0.72rem;
    letter-spacing:0.28em;
    text-transform:uppercase;
    color:var(--glow-soft);
    margin-bottom:1.1rem;
  }
  .hero h1{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:clamp(2.6rem, 7vw, 5rem);
    line-height:0.95;
    margin:0 0 1rem;
    letter-spacing:-0.01em;
  }
  .hero p{
    font-family:'Fraunces', serif;
    font-style:italic;
    font-weight:400;
    font-size:clamp(1.05rem, 2.4vw, 1.35rem);
    color:var(--glow-soft);
    max-width:560px;
    margin:0 auto 2.2rem;
    line-height:1.5;
  }
  .hero-links{
    display:flex;
    gap:0.9rem;
    justify-content:center;
    flex-wrap:wrap;
    padding-bottom:2.4rem;
  }
  .btn{
    font-family:'IBM Plex Mono', monospace;
    font-size:0.78rem;
    letter-spacing:0.04em;
    text-decoration:none;
    padding:0.65rem 1.15rem;
    border-radius:var(--radius);
    transition:transform 0.15s ease, opacity 0.15s ease;
  }
  .btn-solid{background:var(--glow); color:var(--ink);}
  .btn-outline{border:1px solid rgba(251,245,233,0.4); color:var(--paper);}
  .btn:hover{transform:translateY(-1px); opacity:0.9;}

  .skyline{display:block; width:100%; height:auto; position:relative; z-index:1;}
  .skyline path, .skyline circle, .skyline rect, .skyline polygon{fill:var(--ink);}

  /* ---------- FILTER BAR ---------- */
  .filters{
    position:sticky;
    top:0;
    z-index:10;
    background:var(--paper);
    border-bottom:1px solid var(--line);
    padding:0.9rem 1.5rem;
    display:flex;
    gap:0.5rem;
    flex-wrap:wrap;
    justify-content:center;
  }
  .pill{
    font-family:'IBM Plex Mono', monospace;
    font-size:0.75rem;
    letter-spacing:0.03em;
    background:transparent;
    border:1px solid var(--line);
    color:var(--dusk);
    padding:0.45rem 0.9rem;
    border-radius:100px;
    cursor:pointer;
    transition:all 0.15s ease;
  }
  .pill:hover{border-color:var(--ink);}
  .pill.active{background:var(--ink); color:var(--paper); border-color:var(--ink);}
  .pill .count{opacity:0.55; margin-left:0.35em;}

  /* ---------- GRID ---------- */
  main{max-width:1080px; margin:0 auto; padding:3rem 1.5rem 5rem;}
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(260px, 1fr));
    gap:1.1rem;
  }
  .card{
    background:var(--card);
    color:var(--paper);
    border-radius:var(--radius);
    padding:1.4rem 1.3rem 1.3rem;
    display:flex;
    flex-direction:column;
    gap:0.6rem;
    opacity:0;
    transform:translateY(10px);
    animation:rise 0.5s ease forwards;
  }
  @keyframes rise{to{opacity:1; transform:translateY(0);}}
  .card-eyebrow{
    font-family:'IBM Plex Mono', monospace;
    font-size:0.65rem;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--glow-soft);
  }
  .card h3{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:1.28rem;
    line-height:1.15;
    margin:0;
  }
  .meter{display:flex; align-items:center; gap:0.55rem;}
  .meter-track{
    flex:1;
    height:4px;
    background:rgba(251,245,233,0.15);
    border-radius:2px;
    overflow:hidden;
  }
  .meter-fill{height:100%; background:var(--glow);}
  .meter-num{
    font-family:'IBM Plex Mono', monospace;
    font-size:0.72rem;
    color:var(--glow-soft);
    white-space:nowrap;
  }
  .tagline{
    font-family:'Fraunces', serif;
    font-style:italic;
    font-size:0.92rem;
    color:rgba(251,245,233,0.75);
    line-height:1.4;
    margin:0;
  }
  .card.hide{display:none;}

  /* ---------- EMPTY STATE ---------- */
  .empty{
    grid-column:1/-1;
    text-align:center;
    padding:3rem 1rem;
    color:var(--muted);
  }
  .empty p{font-family:'Fraunces', serif; font-style:italic; font-size:1.1rem; margin:0 0 0.9rem;}
  .empty a{color:var(--ink); font-family:'IBM Plex Mono', monospace; font-size:0.78rem;}

  /* ---------- FOOTER ---------- */
  footer{
    border-top:1px solid var(--line);
    padding:2.4rem 1.5rem 3rem;
    text-align:center;
  }
  footer .horizon{width:120px; height:auto; margin:0 auto 1.2rem; opacity:0.5;}
  footer .horizon path, footer .horizon circle{fill:var(--ink);}
  footer p{
    font-family:'IBM Plex Mono', monospace;
    font-size:0.72rem;
    color:var(--muted);
    letter-spacing:0.02em;
  }
  footer a{color:var(--ink);}

  @media (prefers-reduced-motion: reduce){
    .card{animation:none; opacity:1; transform:none;}
    html{scroll-behavior:auto;}
  }
</style>
</head>
<body>

<header class="hero">
  <div class="hero-inner">
    <div class="eyebrow">Archivo de reseñas</div>
    <h1>Las Contraluces</h1>
    <p>Cine, series y libros vistos a contraluz — sin spoilers, sin rodeos.</p>
    <div class="hero-links">
      <a class="btn btn-solid" href="https://remylebeau.substack.com" target="_blank" rel="noopener">Leer en Substack</a>
      <a class="btn btn-outline" href="https://go.ivoox.com/sq/2373042" target="_blank" rel="noopener">La Contralúdica ↗</a>
    </div>
  </div>
  <svg class="skyline" viewBox="0 0 1200 160" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <rect x="0" y="120" width="1200" height="40"></rect>
    <!-- film reel -->
    <circle cx="160" cy="90" r="46"></circle>
    <circle cx="160" cy="90" r="10" fill="var(--paper)" style="fill:var(--paper)"></circle>
    <!-- open book -->
    <path d="M 380 140 L 380 70 Q 440 55 470 70 L 470 140 Z"></path>
    <path d="M 470 140 L 470 70 Q 500 55 560 70 L 560 140 Z"></path>
    <!-- tv -->
    <rect x="680" y="55" width="130" height="90" rx="4"></rect>
    <rect x="720" y="30" width="8" height="30" transform="rotate(-20 724 45)"></rect>
    <rect x="770" y="30" width="8" height="30" transform="rotate(20 774 45)"></rect>
    <!-- die -->
    <polygon points="960,60 1030,60 1055,90 1030,140 960,140 935,90"></polygon>
  </svg>
</header>

<nav class="filters" id="filters">
  <button class="pill active" data-cat="all">Todo</button>
  <button class="pill" data-cat="cine">Cine</button>
  <button class="pill" data-cat="series">Series</button>
  <button class="pill" data-cat="libros">Libros</button>
  <button class="pill" data-cat="juegos">Juegos</button>
</nav>

<main>
  <div class="grid" id="grid"></div>
</main>

<footer>
  <svg class="horizon" viewBox="0 0 120 30" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <rect x="0" y="24" width="120" height="6"></rect>
    <circle cx="60" cy="14" r="10"></circle>
  </svg>
  <p>Las Contraluces · un archivo de <a href="https://remylebeau.substack.com" target="_blank" rel="noopener">Remy Lebeau</a> · reseñas completas en Substack</p>
</footer>

<script>
const reviews = [
  // CINE
  {t:"Master & Commander", cat:"cine", stars:4.5, tag:null},
  {t:"Teniente Corrupto", cat:"cine", stars:4, tag:null},
  {t:"Superman (2025)", cat:"cine", stars:4, tag:null},
  {t:"Zootropolis 2", cat:"cine", stars:4, tag:null},
  {t:"4 Fantásticos: Primeros Pasos", cat:"cine", stars:4, tag:null},
  {t:"Hoppers", cat:"cine", stars:4, tag:null},
  {t:"Sinners", cat:"cine", stars:4, tag:null},
  {t:"Ruta de Escape", cat:"cine", stars:3.5, tag:"Heat sin Mann. Pero con alma propia."},
  {t:"Despierta la furia", cat:"cine", stars:4, tag:"El Ritchie que nadie esperaba."},
  {t:"MI: The Final Reckoning", cat:"cine", stars:3.5, tag:null},
  {t:"The Running Man (2025)", cat:"cine", stars:3.5, tag:null},
  {t:"The Negotiator (1998)", cat:"cine", stars:3.5, tag:null},
  {t:"F1 (2025)", cat:"cine", stars:3, tag:null},
  {t:"28 Años Después", cat:"cine", stars:3, tag:null},
  {t:"Frankenstein (2025)", cat:"cine", stars:3, tag:null},
  {t:"Falsas Apariencias", cat:"cine", stars:3, tag:null},
  {t:"La Lista Final", cat:"cine", stars:3, tag:null},
  {t:"Gran Turismo", cat:"cine", stars:2, tag:null},
  {t:"Jurassic World Rebirth", cat:"cine", stars:2, tag:null},
  {t:"El Club del Crimen de los Jueves", cat:"cine", stars:2, tag:null},
  // SERIES
  {t:"Sandman T2", cat:"series", stars:4.5, tag:null},
  {t:"Slow Horses T5", cat:"series", stars:4, tag:"Menos conspiración, más humor negro, igual de imprescindible."},
  {t:"MobLand", cat:"series", stars:4, tag:null},
  {t:"Bosch", cat:"series", stars:4, tag:"Jazz, crimen y ningún atajo."},
  {t:"Bosch Legacy", cat:"series", stars:4, tag:null},
  {t:"The Rookie T1–6", cat:"series", stars:3.5, tag:null},
  {t:"Castle", cat:"series", stars:3.5, tag:null},
  {t:"Ballard", cat:"series", stars:3, tag:null},
  {t:"Ironheart", cat:"series", stars:3, tag:null},
  // LIBROS
  {t:"El Imperio del Vampiro", cat:"libros", stars:4, tag:null},
  {t:"El Imperio de los Condenados", cat:"libros", stars:4, tag:null},
];

const catLabels = {cine:"Cine", series:"Series", libros:"Libros", juegos:"Juegos"};
const grid = document.getElementById('grid');

function cardHTML(r){
  const pct = (r.stars/5*100).toFixed(0);
  return `<article class="card" data-cat="${r.cat}">
    <div class="card-eyebrow">${catLabels[r.cat]}</div>
    <h3>${r.t}</h3>
    <div class="meter">
      <div class="meter-track"><div class="meter-fill" style="width:${pct}%"></div></div>
      <span class="meter-num">${r.stars}/5</span>
    </div>
    ${r.tag ? `<p class="tagline">"${r.tag}"</p>` : ``}
  </article>`;
}

function render(){
  grid.innerHTML = reviews.map(cardHTML).join('');
  // stagger entrance
  document.querySelectorAll('.card').forEach((c,i)=>{
    c.style.animationDelay = `${Math.min(i*0.03,0.4)}s`;
  });
}
render();

const counts = {all:reviews.length};
['cine','series','libros','juegos'].forEach(c=>{
  counts[c] = reviews.filter(r=>r.cat===c).length;
});

const emptyStates = {
  juegos: `<div class="empty"><p>Las reseñas de juegos de mesa llegan pronto por aquí.</p><a href="https://go.ivoox.com/sq/2373042" target="_blank" rel="noopener">Mientras tanto, escucha La Contralúdica ↗</a></div>`
};

document.getElementById('filters').addEventListener('click', (e)=>{
  const btn = e.target.closest('.pill');
  if(!btn) return;
  document.querySelectorAll('.pill').forEach(p=>p.classList.remove('active'));
  btn.classList.add('active');
  const cat = btn.dataset.cat;

  if(cat === 'all'){
    render();
    return;
  }
  const filtered = reviews.filter(r=>r.cat===cat);
  if(filtered.length === 0){
    grid.innerHTML = emptyStates[cat] || `<div class="empty"><p>Aún no hay reseñas aquí.</p></div>`;
  } else {
    grid.innerHTML = filtered.map(cardHTML).join('');
    document.querySelectorAll('.card').forEach((c,i)=>{
      c.style.animationDelay = `${Math.min(i*0.03,0.4)}s`;
    });
  }
});
</script>

</body>
</html>
